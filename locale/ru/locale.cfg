[mod-name]
lane-belt-balancer=Планировщик балансировщиков

[mod-description]
lane-belt-balancer=Выделите концы входных конвейеров и начала выходных (или промежуток между ними). Мод подберёт подходящий балансировщик, проложит к нему конвейеры и поставит призраки.

[item-name]
lbb-balancer-tool=Планировщик балансировщиков

[item-description]
lbb-balancer-tool=Выделение: построить балансировщик между концами конвейеров (конвейеры могут целиком лежать внутри выделения). Деревья, камни и скалы на пути помечаются на снос.\nShift + выделение: убрать призраки, поставленные этим инструментом.

[shortcut-name]
lbb-give-tool=Планировщик балансировщиков

[controls]
lbb-give-tool=Планировщик балансировщиков
lbb-remove-last=Убрать последний балансировщик

[mod-setting-name]
lbb-tier=Уровень конвейеров
lbb-verbose=Дублировать сообщения в чат
lbb-work-per-tick=Работа планировщика за тик
lbb-time-limit=Ограничение времени расчёта (секунды)

[mod-setting-description]
lbb-time-limit=Расчёт останавливается через столько секунд игрового времени. Если рабочая схема уже найдена, ставится лучшая из найденных.
lbb-work-per-tick=Расчёт растягивается на несколько тиков, чтобы игра не зависала. Меньше — плавнее, но дольше; больше — быстрее, но возможны подтормаживания. Единица — примерно один шаг поиска пути конвейера.
lbb-tier=Какой из выделенных конвейеров задаёт уровень новых конвейеров, разделителей и подземных конвейеров.

[string-mod-setting]
lbb-tier-fastest=Самый быстрый из выделенных
lbb-tier-slowest=Самый медленный из выделенных

[lbb]
no-ends=Найдено входов: __1__, выходов: __2__. Выделите область, где заканчиваются входные конвейеры и начинаются выходные, со свободным местом между ними.
no-tier=Не найдены разделитель и подземный конвейер под эти конвейеры.
too-big=Слишком большое выделение (максимум __1__×__1__ клеток).
input-leaves=Входной конвейер в точке __1__, __2__ смотрит за пределы выделения. Увеличьте выделение.
no-template=Нет схемы для __1__ → __2__ (поддерживается до __3__ входов и до __3__ выходов).
no-room=В выделении нет места для балансировщика __1__ → __2__ (сама схема занимает __3__ × __4__ клеток).
no-route=Балансировщик __1__ → __2__ помещается, но к нему не удаётся проложить конвейеры. Увеличьте выделение.
gave-up=Поиск схемы __1__ → __2__ прерван. Попробуйте выделение поменьше или посвободнее.
place-failed=Не удалось поставить призрак в __1__, __2__; ничего не построено.
placed=Построено: __1__ (__2__ → __3__), призраков: __4__.
placed-clear=Построено: __1__ (__2__ → __3__), призраков: __4__, помечено на снос (деревья, камни, скалы, конвейеры): __5__.
removed=Убрано призраков: __1__.
planning=Расчёт балансировщика…
progress-title=Расчёт балансировщика __1__ → __2__
progress-text=__1__%   __2__ с из __3__ с
progress-hint=Ищу подходящий размер выделения… __1__%   __2__ с из __3__ с
cancel=Отмена
cancelled=Расчёт отменён.
busy=Предыдущий балансировщик ещё рассчитывается. Подождите или нажмите «Отмена» в его окне.
timeout=Расчёт остановлен через __1__ с: схема не найдена. Попробуйте выделение поменьше или посвободнее либо увеличьте ограничение времени в настройках карты.
timeout-best=Достигнуто ограничение времени (__1__ с): поставлена лучшая из найденных схем.
try-size=Получится с выделением __1__ × __2__ клеток (на __3__ больше с каждой стороны).

