[mod-name]
lane-belt-balancer=Belt Balancer Planner

[mod-description]
lane-belt-balancer=Drag over the input belt ends and output belt starts (or the gap between them). The mod picks a balancer that fits, routes the belts to it and places ghosts.

[item-name]
lbb-balancer-tool=Belt balancer planner

[item-description]
lbb-balancer-tool=Drag: place a balancer between the belt ends in the area (belts may lie completely inside it). Trees, rocks and cliffs in the way are marked for removal.\nShift + drag: remove ghosts placed by this tool.

[shortcut-name]
lbb-give-tool=Belt balancer planner

[controls]
lbb-give-tool=Belt balancer planner
lbb-remove-last=Remove last planned balancer

[mod-setting-name]
lbb-tier=Belt tier for the balancer
lbb-verbose=Also print messages in chat
lbb-work-per-tick=Planning work per tick

[mod-setting-description]
lbb-work-per-tick=Planning is spread over several ticks so the game doesn't freeze. Lower: smoother but slower planning; higher: faster but may stutter. One unit is roughly one step of the belt route search.
lbb-tier=Which of the selected input/output belts sets the tier of the new belts, splitters and underground belts.

[string-mod-setting]
lbb-tier-fastest=Fastest selected belt
lbb-tier-slowest=Slowest selected belt

[lbb]
no-ends=Found __1__ input belt end(s) and __2__ output belt start(s). Select the area where input belts end and output belts begin, with free ground between them.
no-tier=No buildable splitter and underground belt match these belts.
too-big=Selection too large (max __1__×__1__ tiles).
input-leaves=The input belt ending at __1__, __2__ points out of the selection. Make the selection bigger.
no-template=No balancer design for __1__ → __2__ belts (supported: up to __3__ inputs and __3__ outputs).
no-room=No room for a __1__ → __2__ balancer in the selection (the design alone needs a free __3__ × __4__ area).
no-route=A __1__ → __2__ balancer fits, but the belts can't be routed to it. Try a bigger selection.
gave-up=Stopped searching for a __1__ → __2__ layout. Try a smaller or less cluttered selection.
place-failed=Could not place a ghost at __1__, __2__; nothing was placed.
placed=Placed __1__ (__2__ → __3__): __4__ ghosts.
placed-clear=Placed __1__ (__2__ → __3__): __4__ ghosts, __5__ trees, rocks, cliffs or belts marked for removal.
removed=Removed __1__ planned ghost(s).
planning=Planning the balancer…
try-size=It works with a selection of __1__ × __2__ tiles (__3__ more on each side).

[lbb-template]
2x3=2 → 3 balancer
1x3=1 → 3 splitter
lane-1x1=1 → 1 lane balancer
2x1=2 → 1 merger
2x2=2 → 2 balancer
4x1=4 → 1 merger
4x2=4 → 2 balancer
2x4=2 → 4 balancer
4x4=4 → 4 balancer
3x3=3 → 3 balancer
generated=generated balancer
book=balancer from the balancer book
